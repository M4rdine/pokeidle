# Configuração do Fly.io. O banco fica fora (Neon), então a aplicação não tem volume nem estado
# em disco: dá para matar e recriar a máquina sem perder nada.
app = "pokeidle"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  COOKIE_SECURE = "true"
  # Atrás do proxy do Fly, um hop: sem isso o limite por IP veria sempre o mesmo endereço.
  TRUST_PROXY = "1"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3000
  force_https = true
  # O agendador roda a 5 ticks por segundo e mantém WebSocket aberto: a máquina não pode dormir.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
